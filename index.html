<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="description" content="A calm, personal 90-day habit tracker. Show up for one small thing, one day at a time.">
  <title>Daily Actions — your 90-day habit tracker</title>
  <style>
    :root{--paper:#f5f4ee;--card:#fffefa;--ink:#252a25;--muted:#7b8077;--line:#e7e8df;--green:#526f58;--green-soft:#e4ece1;--lime:#d4e47a;--amber:#f4ead2;--amber-ink:#8c713a;--miss:#f4e6df;--shadow:0 14px 42px #343a2810}
    *{box-sizing:border-box} body{position:relative;isolation:isolate;margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}body::before{content:'';position:fixed;inset:-8px;z-index:-1;background:url('habit-background.png') center/cover no-repeat;opacity:.14;filter:blur(7px);pointer-events:none}
    button,input{font:inherit} button{cursor:pointer} .shell{max-width:1120px;margin:auto;padding:0 36px 72px}
    header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e5dc}
    .brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;letter-spacing:-.03em}.brand-mark{width:29px;height:29px;display:grid;place-items:center;background:var(--green);color:white;border-radius:9px}.brand-mark svg{width:17px}
    .header-note{font:11px Consolas,monospace;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}.live-dot{width:7px;height:7px;background:#89a267;border-radius:50%}
    main{padding-top:56px}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--green);font:11px Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}.eyebrow:before{content:'';width:22px;height:1px;background:var(--green)}
    h1{font:500 clamp(39px,6vw,67px)/1.04 Georgia,serif;letter-spacing:-.045em;margin:16px 0 13px;max-width:720px}.intro{max-width:510px;color:#72776f;line-height:1.65;font-size:15px;margin:0}
    .habit-card{margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:var(--shadow)}.habit-copy{min-width:0}.field-label{display:block;color:var(--muted);font:10px Consolas,monospace;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}.habit-name{font:600 23px Segoe UI,Arial,sans-serif;letter-spacing:-.04em;border:0;outline:0;background:transparent;color:var(--ink);width:min(100%,480px);padding:0}.habit-name:focus{box-shadow:0 2px 0 var(--green)}.dates{margin-top:8px;font-size:12px;color:var(--muted)}.date-editor{display:flex;align-items:center;gap:9px}.date-editor label{font:10px Consolas,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.start-date{border:1px solid var(--line);background:#fffefa;border-radius:8px;padding:9px 10px;color:var(--ink);font-size:12px}.edit-note{font-size:10px;color:#999c94;white-space:nowrap}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:15px}.stat{border:1px solid var(--line);background:#faf9f4;border-radius:13px;padding:17px 18px;min-height:91px}.stat-label{font:10px Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.stat-value{font:600 25px Segoe UI,Arial,sans-serif;letter-spacing:-.05em;margin-top:8px}.stat-value small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
    .tracker{margin-top:25px;background:#fffefaf2;border:1px solid var(--line);border-radius:18px;padding:25px 28px 28px;box-shadow:var(--shadow)}.tracker-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.tracker-title{margin:0;font-size:17px;letter-spacing:-.03em;font-weight:600}.tracker-sub{font-size:12px;color:var(--muted);margin-top:5px}.ring-wrap{display:flex;align-items:center;gap:10px}.ring{width:48px;height:48px;position:relative}.ring svg{width:48px;height:48px;transform:rotate(-90deg)}.ring-bg,.ring-fill{fill:none;stroke-width:4}.ring-bg{stroke:#ebede6}.ring-fill{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .35s}.ring-number{position:absolute;inset:0;display:grid;place-items:center;font:10px Consolas,monospace}.ring-caption{font-size:11px;color:var(--muted);max-width:64px;line-height:1.35}
    .legend{display:flex;align-items:center;gap:17px;flex-wrap:wrap;margin:0 0 25px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.key{width:12px;height:12px;border-radius:4px;background:#f0f0e9;border:1px solid #e3e4da}.key.done{background:var(--green);border-color:var(--green)}.key.today{background:#fff;border:1.5px solid #9aa95f}.key.missed{background:var(--miss);border-color:#ecd6ca}.key.future{background:#f0f0e9;opacity:.55}
    .weeks{display:flex;flex-direction:column;gap:17px}.week{position:relative;display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));gap:8px;align-items:start}.week-label{font:9px Consolas,monospace;letter-spacing:.04em;color:#9a9d94;padding-top:29px}.day{min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}.day-name{font:9px Consolas,monospace;color:#9a9d94;text-transform:uppercase;letter-spacing:.06em}.day button{width:100%;aspect-ratio:1/1;max-width:72px;min-height:43px;border:1px solid #e7e8e0;border-radius:11px;background:#f7f7f1;color:#92968e;transition:transform .15s,background .15s,border .15s;position:relative}.day button:hover:not(:disabled){transform:translateY(-2px);border-color:#aab99b}.day button .num{font:11px Consolas,monospace}.day button .check{display:none;width:15px;height:15px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.day button.completed{background:var(--green);border-color:var(--green);color:white}.day button.completed .num{display:none}.day button.completed .check{display:block}.day button.today{background:#fff;border:1.5px solid #9aa95f;color:var(--ink);box-shadow:0 0 0 3px #9aa95f22}.day button.today.completed{background:var(--green);color:white}.day button.missed:not(.completed){background:var(--miss);border-color:#f0ddd3;color:#9c7969}.day button.future{opacity:.62}.day button:disabled{cursor:default}.day button:focus-visible{outline:3px solid #b8c88d;outline-offset:2px}.month-tag{grid-column:2/-1;font:10px Consolas,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--green);padding-bottom:1px;margin-top:3px;display:none}.month-tag.visible{display:block}.week.empty{visibility:hidden}
    .quote-toast{position:fixed;z-index:10;left:50%;bottom:24px;width:min(560px,calc(100% - 32px));padding:16px 20px;border:1px solid #ffffff33;border-radius:14px;background:#354d39;color:#fffefa;box-shadow:0 14px 36px #17231845;font:500 16px Georgia,serif;line-height:1.45;text-align:center;opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:opacity .35s ease,transform .35s ease}.quote-toast.show{opacity:1;transform:translate(-50%,0)}
    .bottom-row{border-top:1px solid var(--line);margin-top:25px;padding-top:19px;display:flex;align-items:center;justify-content:space-between;gap:20px}.encouragement{font:500 14px Georgia,serif;color:#686f61}.reset{border:0;background:transparent;color:#8a8d84;font-size:11px;padding:8px 0;text-decoration:underline;text-decoration-color:#c6c8bd;text-underline-offset:3px}.reset:hover{color:#a2503b}.storage-note{font-size:10px;color:#a2a49c;display:flex;gap:6px;align-items:center}.storage-note svg{width:13px}
    footer{display:flex;justify-content:space-between;gap:20px;margin-top:22px;color:#9a9d94;font:10px Consolas,monospace;letter-spacing:.03em}
    @media(max-width:700px){.shell{padding:0 19px 45px}header{height:68px}.header-note{font-size:9px}main{padding-top:39px}.intro{font-size:14px}.habit-card{padding:19px;align-items:flex-start;flex-direction:column;gap:18px;margin-top:26px}.habit-name{font-size:21px}.date-editor{width:100%;justify-content:space-between}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px 15px;min-height:81px}.stat-value{font-size:23px}.tracker{margin-top:18px;padding:20px 16px 21px}.tracker-head{margin-bottom:19px}.week{grid-template-columns:29px repeat(7,minmax(0,1fr));gap:5px}.week-label{font-size:8px;padding-top:26px}.day{gap:6px}.day-name{font-size:8px}.day button{min-height:36px;border-radius:9px}.day button .num{font-size:10px}.weeks{gap:14px}.legend{gap:10px 13px;font-size:10px}.bottom-row{align-items:flex-start;flex-direction:column;gap:10px}.storage-note{order:2}footer{font-size:9px;flex-direction:column;gap:7px}.quote-toast{bottom:14px;padding:14px 16px;font-size:15px}}
    @media(max-width:380px){.shell{padding-left:13px;padding-right:13px}.tracker{padding-left:11px;padding-right:11px}.week{grid-template-columns:25px repeat(7,minmax(0,1fr));gap:4px}.day button{min-height:32px}.day-name{font-size:7px}.header-note{letter-spacing:.04em}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#" aria-label="Daily Actions home"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 12.5 4 4L18.5 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Daily Actions</a>
      <div class="header-note"><span class="live-dot"></span> a little, every day</div>
    </header>
